#
# herdr-plugin.toml registers herdr-project with Herdr. Install it from a checkout with
# `herdr plugin link .`, or from GitHub with `herdr plugin install LandonSchropp/herdr-project`.
#
# The plugin opens a project and one of its Git worktrees in two steps: choose the project, then
# name the branch to open it on. The name is prefilled with the repository's main checkout, and a
# branch with no worktree yet gets one created for it.
#
# The same operations are available non-interactively for agents and scripts:
#
#   ./scripts/run.sh list [--json]
#   ./scripts/run.sh create <project> [--branch <branch>]

id = "landonschropp.herdr-project"
name = "Herdr Project"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Open a project and one of its Git worktrees from two pickers."
platforms = ["linux", "macos"]

# Install dependencies so the Bun entry point can run. Herdr runs this once, after you confirm the
# install and before registering the plugin.
[[build]]
command = ["sh", "scripts/build.sh"]

# project — the plugin's entry point. Opens the picker flow, which ends by opening the chosen
# worktree into a Herdr workspace. Bind a key to it or run it from Herdr's action menu.
#
# Herdr runs an action headless, so this asks Herdr for a pane running the "picker" entry point
# below rather than rendering the TUI itself.
[[actions]]
id = "project"
title = "Herdr Project: Open Project"
command = ["./scripts/open.sh"]

# picker — the flow as a Herdr-managed pane. Herdr gives it a zoomed pane, runs the TUI, and tears
# the pane down when it exits.
[[panes]]
id = "picker"
title = "Herdr Project"
placement = "zoomed"
command = ["./scripts/run.sh"]

# workspace.created — lays a project's tabs into every workspace Herdr creates, whether it came
# from this plugin, from Herdr's own UI, or from Herdr opening a worktree's parent on its own. It
# is a quiet no-op for a workspace with no worktree, one whose repository is not a configured
# project, or one that already has its tabs. Herdr runs this for you — never invoke it by hand.
# Output is captured in `herdr plugin log list --plugin landonschropp.herdr-project`.
[[events]]
on = "workspace.created"
command = ["./scripts/run.sh", "on-workspace"]
