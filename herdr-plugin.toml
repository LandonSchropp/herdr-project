#
# herdr-plugin.toml registers herdr-project with Herdr. Install it from a checkout with
# `herdr plugin link .`, or from GitHub with `herdr plugin install LandonSchropp/herdr-project`.
#
# The plugin opens a project and one of its Git worktrees in two steps: choose the project, then
# name the branch to open it on. An empty name opens the project's main checkout, and a branch with
# no worktree yet gets one created for it.
#
# The same operations are available non-interactively for agents and scripts:
#
#   ./scripts/run.sh list [--json]
#   ./scripts/run.sh open <project> [--worktree <branch>] [--prompt <text>]
#   ./scripts/run.sh close <project> [--worktree <branch>] [--yes]

id = "landonschropp.herdr-project"
name = "Herdr Project"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Open Herdr workspaces with preconfigured layouts."
platforms = ["linux", "macos"]

# Install dependencies so the Bun entry point can run. Herdr runs this once, after you confirm the
# install and before registering the plugin.
[[build]]
command = ["sh", "scripts/build.sh"]

# startup — reports every open workspace's project name as the `project` metadata token, which a
# sidebar row renders as `$project`. Herdr runs this for you, once it has restored a session — never
# invoke it by hand.
[[startup]]
command = ["./scripts/run.sh", "on-startup"]

# project — the plugin's entry point. Opens the picker flow, which ends by opening the chosen
# worktree into a Herdr workspace. Bind a key to it or run it from Herdr's action menu.
#
# Herdr runs an action headless, so this asks Herdr for a pane running the "picker" entry point
# below rather than rendering the TUI itself.
[[actions]]
id = "project"
title = "Herdr Project: Open Project"
command = ["./scripts/open.sh"]

# picker — the flow as a Herdr-managed pane. Herdr gives it a zoomed pane, runs the TUI, and tears
# the pane down when it exits.
[[panes]]
id = "picker"
title = "Herdr Project"
placement = "zoomed"
command = ["./scripts/run.sh"]

# workspace.created — reports the workspace's project name and lays that project's tabs into every
# workspace Herdr creates, whether it came from this plugin, from Herdr's own UI, or from Herdr
# opening a worktree's parent on its own. Both are a quiet no-op for a workspace with no worktree or
# one whose repository is not a configured project, and the tabs are skipped again for a workspace
# that already has them. Herdr runs this for you — never invoke it by hand. Output is captured in
# `herdr plugin log list --plugin landonschropp.herdr-project`.
[[events]]
on = "workspace.created"
command = ["./scripts/run.sh", "on-workspace"]

# worktree.created — copies the untracked files a repository's `.worktreeinclude` matches from its
# main checkout into every worktree Herdr creates, whether it came from this plugin or from Herdr's
# own UI. It is a quiet no-op for a checkout with no include file, no matching files, or a file the
# worktree already has. Herdr runs this for you — never invoke it by hand. Output is captured in
# `herdr plugin log list --plugin landonschropp.herdr-project`.
[[events]]
on = "worktree.created"
command = ["./scripts/run.sh", "on-worktree"]
